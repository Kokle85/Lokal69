# SUV / off-road / crossover reference taxonomy used by domain/taxonomy.py and domain/filters.py.
#
# verification: unverified_reference
#   Generation codes and year ranges are ENGINEERING REFERENCE DATA compiled from widely published
#   public model histories. They have NOT been verified against manufacturer documents and must be
#   reviewed by the owner before they are relied on for valuation. Year ranges are approximate
#   production/market years; first-registration years near a boundary are deliberately treated as
#   ambiguous by the matcher. Where a generation code or boundary was not known with confidence the
#   generation is omitted (the matcher then reports the generation as unknown) rather than guessed.
#
# Classes: suv | offroad | crossover count as SUV identity; pickup | estate are listed only as
#   explicit exclusions so that, e.g., a Nissan Navara or Subaru Outback is rejected as NOT_SUV
#   instead of being treated as unknown. Marketplaces often file pickups and raised estates in an
#   "SUV / off-road" category, so the common ones are listed as exclusions (no generation data).
# Scope: models plausibly offered in DE/IT/CH at roughly EUR 2,500-3,000 (mostly model years
#   ~2004-2014). Models missing from this file are UNKNOWN (never "not an SUV").
verification: unverified_reference
version: "2026-10-06.2"
note: >-
  Engineering reference data for owner review; not manufacturer-verified. Do not treat a
  generation code from this file as verified evidence for comparables or tax classification.

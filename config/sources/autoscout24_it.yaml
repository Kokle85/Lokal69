# AutoScout24 Italy public listings (IT). Candidate acquisition source - DISABLED.
# Each AutoScout24 country is registered and gated separately.
# A stored owner acknowledgement audits a decision; it is NOT legal permission,
# and public accessibility is NOT permission.
source_key: autoscout24_it
display_name: "AutoScout24 Italy public listings (IT)"
country: IT
role: acquisition
mode: public_html
adapter: autoscout24_public_it
adapter_version: "autoscout24@1.0.0"   # built from owner captures 2026-10-15/16; live smoke passed 2026-10-17
enabled: false
# Activation step 5 done 2026-10-16: the SYNTHETIC saved-fixture set
# tests/adapters/fixtures/autoscout24_it/ (MANIFEST.yaml, spec-31 coverage) passes
# tests/adapters/test_autoscout24_fixtures.py.
# Activation step 6 done 2026-10-17: the owner's live smoke at commit 25f43f8 (docs/runbook.md 9.1,
# a 12-model `crawl once --max-pages 12`, then `worker --drain --queues detail --max-jobs 5`):
# the worker fetched robots.txt itself (HTTP 200, available, sha256 7c78475c..., unchanged), 12
# search pages HTTP 200, access ok, complete, 15 cards, 5 detail pages ingested, no block; the
# source was switched off again. Run ids and the full evidence record: docs/source_access_register.md
# ("Live smoke evidence"). Still disabled: enabling is step 7, a separate owner decision.
technical_status: live_smoke_passed
terms_status: restricted
terms_url: https://www.autoscout24.com/company/agb/
terms_reviewed_at: 2026-10-06T00:00:00Z
terms_decision: proceed_acknowledged
terms_decision_actor: "owner (decision recorded 2026-10-10)"
terms_decision_note: >-
  Owner decision 2026-10-10, re-confirmed 2026-10-14 ("ги одобрувам mobile.de, AutoScout24 да се скенираат"): include this source despite the restricted terms; the owner accepts that risk (audit record, not legal permission). Collection stays low-volume, obeys robots.txt on every fetch, never uses CAPTCHA solving, stealth, proxies or fingerprint evasion, and stops on any access block.
technical_denial_policy: stop_and_report
robots_policy: obey
robots_checked_at: 2026-10-14T00:00:00Z
robots_summary: >-
  robots.txt re-checked 2026-10-14, unchanged since 2026-10-06 (fact, not permission; sha256 7c78475c...): the 'User-agent: *' group disallows a query on the bare search path (/lst? and /lst/?), /ricerca-avanzata, dealer pages and API paths; it does not disallow /lst/<make>/<model> search pages or /annunci/ detail pages. No Crawl-delay.
allowed_hosts:
  - 'www.autoscout24.it'
allowed_search_paths:
  - '^/lst/[a-z0-9-]+(/[a-z0-9-]+){0,2}$'
allowed_detail_paths:
  # '+' occurs in real listing slugs (2026-10-16 captures); the URL must still end in the listing UUID.
  - '^/annunci/[A-Za-z0-9][A-Za-z0-9._~%+-]{0,300}/?$'
# Discovery schedule, owner decision 2026-10-16 (verbatim): "сакам на секои 30 минуту да го
# наместиш само од 08:00 до 22:00" (every 30 minutes, only from 08:00 to 22:00, owner's local time).
# Slots 08:00, 08:30, ..., 21:30 Europe/Skopje (22:00 is the exclusive end; CET/CEST handled):
# 28 runs a day x 12 search pages = 336 search requests a day, all inside one UTC budget day.
# Budget 600 (owner, 2026-10-16): 336 search + 264 for detail pages. Nothing caps the detail pages
# per run (one per new or changed card, plus stale refreshes); the budget gate keeps them from
# using what the day's remaining runs still need (crawling.rate_limits.SearchReserve), so on a
# busy day the extra detail pages wait (end of the 21:30 run window or next UTC day) and the runs
# up to 21:30 keep their 336. Load check (domain.sources.schedule_budget_problem): 336 + 10
# (one run's max_detail_jobs_per_run) <= 600.
schedule:
  interval_minutes: 30
  window_start: "08:00"
  window_end: "22:00"
  timezone: Europe/Skopje
rate_budget:
  min_delay_seconds: 20            # per-host spacing (shared rate limiter)
  max_search_pages_per_run: 12     # one search page for each of the 12 configured models
  max_detail_jobs_per_run: 10
  daily_request_budget: 600        # 336 search + 264 for detail pages (see schedule above)
search:
  # One search page per model per run (newest first), in this order. Slug verification
  # (2026-10-16, from the owner-captured pages' links and taxonomy): see notes.
  models: >-
    renault/captur nissan/qashqai nissan/juke kia/sportage opel/mokka opel/mokka-x
    dacia/duster peugeot/2008 hyundai/ix35 opel/antara skoda/yeti suzuki/sx4-s-cross
  sort: age
  desc: "1"
  ustate: U   # used cars only: the site's own pageQuery carries ustate (default N,U)
  # Sellers in Italy only (the adapter accepts no other value here). Live finding of the owner's
  # 12-model smoke on 2026-10-17 (crawl once --max-pages 12: 12 search pages HTTP 200, complete,
  # 49 cards, 5 detail pages ingested), sent without a country filter: three of the five
  # ingested listings came from other countries, two Dutch dealers (rejected by screening as
  # COUNTRY_NOT_IN_PROFILE) and a German listing (accepted by the country rule, needs_facts).
  # Each model's one page of 20 newest cards can fill with foreign listings, spending the request
  # budget and hiding Italian ones. The site's normalised query (pageQuery) on the owner's
  # capture carries cy=I, but that request sent no cy: I was the server's default there, while
  # the crawler's requests got foreign sellers. VERIFIED the same day (owner's second 12-model
  # walk with cy=I, run 46f4bdec): 15 cards instead of 49, every one already seen in the
  # unfiltered walk; of the five listings ingested from that walk, the two Italian sellers'
  # (Qashqai, Yeti) are among the 15 and the three foreign ones are not (that run's "listings not
  # seen in a complete scan": 3). So German sellers come in only through autoscout24_de
  # (card_only, no detail page) and Swiss sellers through neither AutoScout24 source
  # (autoscout24_ch is blocked). robots.txt disallows a query only on the bare /lst? and /lst/?
  # paths, not on /lst/<make>/<model>, so the URL still passes the search path policy and robots.txt.
  cy: I
notes: >-
  Adapter autoscout24@1.0.0 (2026-10-16) built from owner-captured pages (structure only, nothing stored): a search page /lst/renault/captur?body=4&kmto=200000 and an /annunci/ detail page (Renault Captur 1.5 dCi). Verified facts: search pages carry their results in script#__NEXT_DATA__ (props.pageProps.numberOfResults, numberOfPages, pageQuery, listings[20]); each listing has id (UUID, equal to the URL's trailing UUID), url /annunci/<slug>-<uuid>, price.priceRaw (integer EUR), vehicle (make, model, modelGroup, transmission Manuale/Automatico/Semiautomatico, fuel Benzina/Diesel/GPL/Elettrica/Benzina, mileageInKm, engineDisplacementInCCM, offerType), tracking (firstRegistration MM-YYYY, fuelType code, mileage, price) and vehicleDetails pills ('81 kW (110 CV)'); only searchResultType Organic / searchResultSection Main are results. The server-normalised pageQuery shows the query keys the site serves: sort, desc, ustate (default N,U), kmto, cy (seller country, I = Italy, the server's default there: the capture's request sent no cy; sent since 2026-10-17, its effect verified live that day, see search.cy), body (body=4 is turned into the path facet /bt_suv-fuoristrada-pick-up, which the search path policy refuses, so it is not sent); pricefrom/priceto are the site's price filter keys (verified by the owner on autoscout24.it). Detail pages publish listingDetails.vehicle (rawPowerInKw, rawDisplacementInCCM, firstRegistrationDateRaw, fuelCategory.raw, rawData.engine.transmissionType.raw, driveTrain 'Anteriore') and a JSON-LD Product whose offers.itemOffered is the Car (productionDate there is the FIRST-REGISTRATION date). Model slugs: renault/captur verified by the search capture; nissan/qashqai, kia/sportage and peugeot/2008 verified as /lst/<make>/<model> links on the captured Italian pages. The owner's two live 12-model walks of 2026-10-17 requested all twelve: every slug answered HTTP 200 (no 404, no redirect), and nissan/juke, dacia/duster, hyundai/ix35, opel/antara and skoda/yeti also returned cards of their own model. opel/mokka, opel/mokka-x and suzuki/sx4-s-cross answered with 0 cards in both walks, consistent with those newer models having no listing at EUR 2,500-3,000 under 200,000 km, so the site accepts them but no result has confirmed them yet (UNVERIFIED by a result). All nine make labels are in the site's taxonomy. Every URL still passes the URL policy and robots.txt at runtime. AutoScout24 consumer terms at https://www.autoscout24.com/company/agb/ (checked 2026-10-06) restrict automated queries and the creation/commercial use of a derived database in sections 8.2-8.3. Whether these or Italy-specific (autoscout24.it) and business-use terms apply must be verified before a decision. Owner-run capture 2026-10-15 (suv-deals capture-samples, structure only): /lst/<make>/<model> answers HTTP 200 (a hyphenated model slug such as rav-4 is redirected with 308 to rav4) and publishes its results as schema.org JSON-LD: a SearchResultsPage whose mainEntity is an ItemList of 20 ListItem entries, each with a relative url /annunci/<slug> and an item typed Car/Product carrying name, brand, model, fuelType, vehicleTransmission, vehicleConfiguration, mileageFromOdometer (QuantitativeValue), image, additionalProperty and offers (Offer: price, priceCurrency, url, availability, itemCondition, seller AutoDealer). Listing links appear only in that JSON-LD; the page's <a> links are facets and dealer pages. robots.txt unchanged (sha256 7c78475c...). Pagination beyond page 1 is not used: one page per model and run.

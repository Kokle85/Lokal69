  Owner decision 2026-10-10, re-confirmed 2026-10-14 ("ги одобрувам mobile.de, AutoScout24 да се скенираат"): include this source despite the restricted terms; the owner accepts that risk (audit record, not legal permission). Collection stays low-volume, obeys robots.txt on every fetch, never uses CAPTCHA solving, stealth, proxies or fingerprint evasion, and stops on any access block.
technical_denial_policy: stop_and_report
robots_policy: obey
robots_checked_at: 2026-10-14T00:00:00Z
robots_summary: >-
  robots.txt re-checked 2026-10-14, unchanged since 2026-10-06 (fact, not permission; sha256 46a815f9...): the 'User-agent: *' group disallows detail pages (/angebote/), a query on the bare search path (/lst? and /lst/?), any URL with a 'cat=' parameter, /detailsuche and API paths. Search pages with make/model path segments (/lst/<make>/<model>?...) are not disallowed. Therefore this source is card_only: search-result cards only, no detail fetches.
detail_mode: card_only
allowed_hosts:
  - 'www.autoscout24.de'
allowed_search_paths:
  - '^/lst/[a-z0-9-]+(/[a-z0-9-]+){0,2}$'

# Reklama5 (MK). Comparable-evidence candidate (role mk_comparable), never an acquisition source.
# DISABLED; exact public routes and terms must be verified first. Asking prices from this
# source are asking prices, not realized sales (spec section 15).
source_key: reklama5_mk
display_name: "Reklama5 public listings (MK comparables)"
country: MK
role: mk_comparable
mode: public_html
adapter: reklama5_mk
adapter_version: unimplemented
enabled: false
technical_status: untested
terms_status: restricted
terms_url: https://reklama5.mk/Help/TermsOfService
terms_reviewed_at: 2026-10-16T00:00:00Z
terms_decision: proceed_acknowledged
terms_decision_actor: "owner (decisions recorded 2026-10-14 and 2026-10-16)"
terms_decision_note: >-
  Owner decision 2026-10-14 ("сакам сите да го вклучиш"): include this source; the owner accepts the
  terms risk (audit record, not legal permission). Owner decision 2026-10-16, after the terms were
  read ("Само факти"): store facts only, namely make, model, year, mileage, fuel, gearbox, asking
  price and the ad URL. No ad text, photos, seller names or contact data, and no retained page
  snapshots. Collection stays low-volume (one pass a day per reference model), obeys robots.txt on
  every fetch, never uses CAPTCHA solving, stealth, proxies or fingerprint evasion, and stops on any
  access block.
technical_denial_policy: stop_and_report
robots_policy: obey
robots_checked_at: 2026-10-16T00:00:00Z
robots_summary: >-
  robots.txt of www.reklama5.mk checked 2026-10-14 from the build environment and re-checked
  2026-10-16 from the owner's network (HTTP 200, unchanged; fact, not permission; sha256
  f82b047730fd...; on 2026-10-14 the apex reklama5.mk served the same file): no 'User-agent: *' group and no
  group for our token, only named groups (Googlebot, Bingbot, msnbot, facebookexternalhit and
  meta-externalagent allowed; SemrushBot, AhrefsBot, PetalBot, Sogou, Baiduspider and contabo
  disallowed). It therefore sets no rules for our user agent (RFC 9309); robots silence is never
  permission.
source_timezone: Europe/Skopje
# Home page only (2026-10-16): for the owner-run reachability probe (`capture-samples
# --search-path /`, scripts/readiness_check.sh). No crawl route; the source stays disabled.
allowed_hosts:

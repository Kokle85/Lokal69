allowed_detail_paths: []
search: {}
notes: >-
  Comparable-source candidate (spec sections 5 and 15): asking prices only, never acquisition.
  Terms of use ("Услови на употреба", updated 03.07.2026; operator Бигмедиа ДООЕЛ, Радолишта,
  Струга) read by the owner on 2026-10-16, because the page answers HTTP 403 to the build
  environment. They contain no clause on automated access, robots or scraping. They prohibit
  collecting other users' personal information such as e-mail addresses and phone numbers ("Не е
  дозволено преку други корисници да се собираат лични информации, како е-мејл адреси и
  телефонски броеви") and copying, altering or extending content from other people's ads ("не е
  дозволено копирање, менување или проширување на содржини од туѓи огласи"). Recorded as
  restricted: the copying clause is read conservatively, hence the owner's facts-only decision.
  Reachability 2026-10-16 from the owner's network (scripts/readiness_check.sh): the home page
  answered HTTP 200 both directly and via Crawl4AI; it links searches as /Search?... and ads as
  /AdDetails?ad=<id> and carries no JSON-LD. On 2026-10-14 every HTML page answered a Cloudflare
  managed challenge to the build environment (a cloud data-centre network), so captures are
  owner-run; any block met there stops the source the same way. The search route, the car
  category and the ad page structure are not verified yet, so only the home page is allowed.

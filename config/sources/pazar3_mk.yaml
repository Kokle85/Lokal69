notes: >-
  Comparable-source candidate (spec sections 5 and 15): asking prices only, never acquisition. No
  separate terms page was found: the footer link to the advertising rules
  (/korisnicka-poddrska/pravila-i-uslovi-za-oglasuvanje) opens the same privacy policy (owner,
  2026-10-16). The privacy policy ("Последна промена на: 28.05.2025"; operator ПАЗАР3.КОМ ДООЕЛ,
  Ресен), read by the owner on 2026-10-16, refers to "Условите за користење на веб страната" but
  contains no clause on automated access, robots, scraping or reuse of ad content. It says that
  visitors' personal data are not collected and that the seller decides whether a phone number is
  shown. Recorded as no_restriction_found, which is not a licence; the referenced terms of use are
  to be read if they are ever published separately. Reachability 2026-10-16 from the owner's
  network (scripts/readiness_check.sh): the home page answered HTTP 200 both directly and via
  Crawl4AI. Only the Crawl4AI (rendered) page carried ads in JSON-LD: an ItemList of Product items
  with an Offer (price and priceCurrency EUR or MKD; 123456789 is a placeholder price, not a price)
  and ad URLs of the form /oglas/vozila/avtomobili/<make>/<model>/.../<id>. The car category is
  /oglasi/vozila/avtomobili. The per-model search route and the ad page structure are not verified
  yet, so only the home page is allowed. Any block met by the crawler stops the source.

# Default cost profile (spec section 18). STATUS: UNAPPROVED. NO AMOUNTS.
#
# Every spec section 18 cost category is listed with status `unknown` and a note. No
# amount here is invented: an unknown line makes the dependent scenario totals unknown
# (never zero) until the owner records a quote, an actual or an approved assumption.
# Activation gate "Cost assumptions" (spec 32): owner-selected business assumptions/quotes
# and currency treatment are required before any threshold-driven alert.
#
# How categories feed the spec 18 arithmetic (domain/costs.py TERM_BY_CATEGORY):
#   purchase (from listing price evidence)       -> purchase_cash_outlay_excluding_deposits
#   bank_fx_charges, travel_inspection          -> acquisition_costs (part of purchase_economic_cost)
#   transport, export_plates_insurance          -> transport
#   customs_broker                              -> clearance
#   import_duty, motor_vehicle_tax, import_vat,
#     other_import_charges                      -> import_components (tax engine, approved rules only)
#   homologation_registration                   -> included_registration
#   repairs                                     -> repairs
#   preparation, storage_holding                -> preparation
#   risk_reserve                                -> reserves
#   selling_costs                               -> selling_costs
#   refundable_deposit                          -> refundable_deposits (cash, not cost, unless the
#                                                  refund is unconfirmed in the conservative scenario)
#
# Amounts, when added later, must be quoted decimal strings ("700.00"), never bare
# floats; YAML floats are rejected on load.
#
# Scoped lines ("ch_purchase"): lines with `scope: {origin_country: CH}` apply only to vehicles
# bought in Switzerland. `CostProfile.lines(target_scope=...)` leaves them out for a DE/IT
# purchase, so they never turn those totals unknown. They are listed IN ADDITION to the general
# lines; where a CH line is the Swiss form of a general line (export plates, VAT deposit), its
# note says which one to record not_applicable so that nothing is counted twice.
# See docs/markets/switzerland.md.
profile_key: default
version: 2
basis: >-
  Placeholder profile listing every required cost category as unknown. No business
  assumptions have been selected or approved by the owner.
currency: EUR
approval_status: unapproved
approved_by: null
approved_at: null
is_fixture: false
notes:
  - "Vehicle purchase payable amount: taken per listing from price evidence (PurchaseInput), never from this profile."
  - "Business tax/accounting treatment is not modelled; results are an estimated contribution before business tax."
  - >-
    CH purchase (ch_purchase scope): Switzerland is not in the EU. A vehicle bought in Switzerland
    does NOT carry EU preferential origin for the North Macedonian import, and the purchase country
    never proves origin. Origin stays separate evidence in the tax engine (TaxInputs.origin_proof);
    no line of this profile models duty, and no preference is assumed.
  - >-
    CH purchase: Swiss VAT (MWST/TVA/IVA) is part of a Swiss dealer's payable price unless the seller
    agrees in writing to invoice the export sale without Swiss VAT; the conditions (export by the
    seller or buyer, customs export evidence, deadlines) are the seller's to state and the owner's to
    confirm. Never assumed from "Export" or "exkl. MWST" wording; the Swiss VAT rate is never hardcoded.
assumptions:
  - category: bank_fx_charges
    label: Bank transfer and currency conversion charges / exchange spread
    status: unknown
    note: Depends on the owner's bank, payment route and currency; needs a bank quote or approved assumption.
  - category: travel_inspection
    label: Travel and pre-purchase inspection
    status: unknown
    note: Only if a trip or third-party inspection is planned; record not_applicable with a reason otherwise.
  - category: transport
    label: Transport to North Macedonia (incl. loading / non-running surcharges)
    status: unknown
    note: Needs a transporter quote scoped to the origin city and vehicle condition (running vs non-running).
  - category: export_plates_insurance
    label: Export registration/plates, insurance and documentation
    status: unknown
    note: Only where actually needed for the planned transport method; period and destination must be stated.
  - category: customs_broker
    label: Customs broker / clearance charges
    status: unknown
    note: Needs a broker quote; scope (declaration type, documents) must be recorded.
  - category: import_duty
    label: Import duty (tax engine)
    status: unknown
    note: Computed only by an ACTIVE, owner-approved tax rule set; unknown until such a rule exists.
  - category: motor_vehicle_tax
    label: Motor-vehicle tax (tax engine)
    status: unknown
    note: Computed only by an ACTIVE, owner-approved tax rule set; CO2 cycle must be documented.
  - category: import_vat
    label: Import VAT (tax engine)
    status: unknown
    note: Computed only by an ACTIVE, owner-approved tax rule set whose taxable base is explicit.
  - category: other_import_charges
    label: Other applicable import charges (tax engine)
    status: unknown
    note: Computed only by an ACTIVE, owner-approved tax rule set.
  - category: homologation_registration
    label: Homologation / CoC / document acquisition, inspection and registration
    status: unknown
    note: Include only where the business model includes registration before sale; otherwise not_applicable with a reason.
  - category: repairs
    label: Mechanical repairs, tyres, brakes, fluids, bodywork and cleaning
    status: unknown
    note: Per vehicle; based on inspection findings or an approved assumption with low/base/high bounds.
  - category: preparation
    label: Sale preparation and advertising
    status: unknown
    note: Per vehicle or an approved assumption.
  - category: storage_holding
    label: Storage and capital/holding cost
    status: unknown
    note: Depends on expected time to sale and financing; owner assumption required.
  - category: risk_reserve
    label: Risk reserve for unverified mechanical/documentary issues
    status: unknown
    note: Owner-selected reserve policy required; use a correlation_group with repairs if both cover the same risk.
  - category: selling_costs
    label: Selling fees
    status: unknown
    note: Marketplace/agent fees in MK; owner assumption or actual fee schedule required.
  - category: refundable_deposit
    label: Refundable deposits (e.g. VAT/export deposit)
    status: unknown
    note: Per transaction from seller terms; record not_applicable with a reason when the seller requires none.
  # ------------------------------------------------------------------ CH purchase (ch_purchase)
  - category: customs_broker
    label: "CH purchase: Swiss export declaration (Ausfuhrdeklaration) via forwarder/customs broker in Switzerland"
    status: unknown
    scope:
      origin_country: CH
      note: "ch_purchase: applies only to vehicles bought in Switzerland"
    note: >-
      ch_purchase. In addition to the MK import clearance line. The vehicle leaves Switzerland under an
      export declaration lodged with Swiss customs (BAZG/FOCBS); who lodges it (dealer, forwarder or
      buyer), the fee and the documents (invoice, Swiss vehicle registration document) need a quote.
      The export declaration is also the evidence a Swiss seller needs before an export sale can be
      invoiced without Swiss VAT. A Swiss purchase does not give EU preferential origin for the MK
      import; origin evidence is handled separately by the tax engine.
  - category: customs_broker
    label: "CH purchase: transit through the EU (e.g. T1 transit declaration and guarantee)"
    status: unknown
    scope:
      origin_country: CH
      note: "ch_purchase: applies only to vehicles bought in Switzerland"
    note: >-
      ch_purchase. Every road route from Switzerland to North Macedonia leaves Switzerland through an EU
      member state (DE, FR, IT or AT). A vehicle bought in Switzerland is not EU goods, so the forwarder
      must state the transit procedure for the whole route (for example a T1 transit declaration with a
      guarantee up to the MK border office), its fee and guarantee cost, and any non-EU countries on the
      route (e.g. via Serbia). Needs a forwarder/customs broker quote; nothing assumed.
  - category: export_plates_insurance
    label: "CH purchase: Swiss export plates and insurance (only if the vehicle is driven out)"
    status: unknown
    scope:
      origin_country: CH
      note: "ch_purchase: applies only to vehicles bought in Switzerland"
    note: >-
      ch_purchase. The Swiss form of the general export plates line: when this line is used, record the
      general line not_applicable ("covered by the CH line") so nothing is counted twice. Only when the
      vehicle is driven: cantonal export plates and insurance covering every transit country and the
      whole period. Whether the canton requires a valid MFK for export plates must be confirmed; a car
      sold 'vor MFK'/'ohne MFK' may have to go by truck. Record not_applicable (reason: truck transport)
      when the vehicle is trucked; the truck itself belongs to the transport line.
  - category: refundable_deposit
    label: "CH purchase: Swiss VAT charged by the seller pending export evidence"
    status: unknown
    scope:
      origin_country: CH
      note: "ch_purchase: applies only to vehicles bought in Switzerland"
    note: >-
      ch_purchase. The Swiss form of the general refundable deposit line: when this line is used, record
      the general line not_applicable so nothing is counted twice. Some Swiss sellers invoice Swiss VAT
      and refund it only after the export declaration is presented; others invoice the export sale
      without Swiss VAT, or not at all. The arrangement, amount (at the seller's stated rate), refund
      prerequisites and timing must come from the seller in writing; never assumed. Record
      not_applicable with a reason when the seller confirms no Swiss VAT is charged.

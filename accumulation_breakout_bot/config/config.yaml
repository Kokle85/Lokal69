# Accumulation Breakout Bot - configuration.
# Live trading is DISABLED by default: the bot runs in signal-only mode and
# never sends orders unless live_trading_enabled is true AND --mode live.

symbol: XAUUSD
timeframe: M5
entry_mode: BREAKOUT_RETEST        # BREAKOUT_RETEST | DIRECT_BREAKOUT

# ---- risk ----
risk_per_trade_percent: 0.5        # % of account balance risked per trade
risk_reward_ratio: 3.0             # TP = entry +/- 3 x risk

# ---- accumulation zone detection ----
# lookback 20 (vs spec 30): calibrated on full-2025 XAUUSD M5 - smaller zones
# put the 3R target within realistic reach; every lb-20 variant tested green
# (PF 1.09-2.00) while lb-30 variants were flat-to-negative.
zone_lookback_candles: 20
minimum_upper_wick_touches: 3
minimum_lower_wick_touches: 3
touch_tolerance_atr_multiplier: 0.25
# CALIBRATED on full-2025 XAUUSD M5: a 30-bar window spans 3.9-6.6 x ATR
# (p10-p75), so the original 0.8-2.0 band matched 0.0% of windows -> 0 trades.
# 1.6-3.4 selects the tightest tail of 20-bar windows (true consolidations).
min_zone_size_atr: 1.6
max_zone_size_atr: 3.4
min_body_inside_zone_percent: 70
max_zone_slope_atr: 0.5            # reject trending ("sloped") windows

# ---- breakout confirmation ----
breakout_buffer_atr_multiplier: 0.15
min_breakout_body_atr_multiplier: 0.4
max_rejection_wick_percent: 40     # reject breakout candles with big opposing wicks

# ---- retest entry (BREAKOUT_RETEST mode) ----
retest_timeout_candles: 12         # give up if no retest within N candles
retest_max_penetration_percent: 50 # cancel if price re-enters deeper than 50% of the zone

# ---- stops ----
stop_buffer_atr_multiplier: 0.10
# COUPLED to the zone band: SL sits beyond the opposite zone side, so the
# stop distance is at least the zone size. max_stop must exceed max_zone
# (+ buffers/breakout excess) or every breakout is rejected.
min_stop_distance_atr: 0.5
max_stop_distance_atr: 3.0
# zone_mid: SL beyond the zone MIDPOINT (half the risk of the spec's
# zone_opposite, so 3R lands within M5 reach). Best full-2025 cell:
# RETEST + zone_mid + ema off -> 10 trades, WR 40%, +6R, PF 2.0.
# zone_opposite restores the original spec placement.
stop_mode: zone_mid

# ---- filters ----
# ema off out-performed ema on in ALL calibrated 2025 variants (small
# samples - flip to true if you prefer the conservative spec default)
use_ema_filter: false
ema_period: 200
use_session_filter: true
sessions:                          # BROKER time (matches your MT5 chart clock)
  london:
    start: "08:00"
    end: "12:00"
  newyork:
    start: "13:30"
    end: "17:00"
max_spread_points: 35
max_trades_per_day: 2
cooldown_minutes: 60

# ---- news filter (placeholder interface, disabled by default) ----
use_news_filter: false
news_block_minutes_before: 30
news_block_minutes_after: 30

# ---- indicators ----
atr_period: 14

# ---- safety ----
live_trading_enabled: false        # double gate: must be true AND --mode live

# ---- Telegram (SHARES the ORB scalper's bot) ----
# Token/chat id resolve from: values here -> environment variables
# (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID) -> the env_file below, which points
# at the scalper project's .env so both bots message the same chat.
telegram:
  enabled: true
  bot_token: ""
  chat_id: ""
  env_file: "../mt5_xauusd_scalper/.env"

# ---- MT5 terminal (leave empty to use the already-logged-in terminal) ----
mt5:
  login:
  password:
  server:
  path:
  magic_number: 26110701
  deviation_points: 20

# ---- backtest simulation ----
backtest:
  spread_points: 25.0              # cost applied on every simulated entry
  point: 0.01                      # XAUUSD point size (used when MT5 absent)
